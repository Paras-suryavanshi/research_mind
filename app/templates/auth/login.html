{% extends "base.html" %}

{% block title %}Sign In | Research Mind{% endblock %}

{% block styles %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - var(--header-height));
        padding: 2rem 1rem;
        background-color: var(--surface-color);
    }
    .auth-card {
        background: white;
        padding: 2.5rem;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--border-light);
    }
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }
    .form-group {
        margin-bottom: 1.25rem;
    }
    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }
    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        font-size: 1rem;
        transition: border-color 0.2s;
    }
    .form-control:focus {
        outline: none;
        border-color: var(--accent-burgundy);
    }
    .auth-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
    }
    .btn-block {
        width: 100%;
        padding: 0.875rem;
        font-size: 1rem;
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
    }
    .auth-link {
        color: var(--accent-burgundy);
        font-weight: 500;
    }
    .error-message {
        color: #dc2626;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        text-align: center;
        display: none;
    }
</style>
{% endblock %}

{% block public_content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome back</h1>
            <p style="color: var(--text-secondary);">Sign in to continue your research.</p>
        </div>
        
        <div id="login-error" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="identifier">Email or username</label>
                <input type="text" id="identifier" class="form-control" placeholder="Enter your email or username" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div class="auth-options">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="remember" style="accent-color: var(--accent-burgundy);">
                    <span>Remember me</span>
                </label>
                <a href="/forgot-password" class="auth-link">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="/signup" class="auth-link">Create one</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;
        const errorDiv = document.getElementById('login-error');
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password, remember })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                errorDiv.textContent = data.error || 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.textContent = 'A network error occurred. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Forgot Password | Research Mind{% endblock %}

{% block styles %}
<style>
    .auth-container { display:flex; justify-content:center; align-items:center; min-height:calc(100vh - var(--header-height)); padding:2rem 1rem; background-color:var(--surface-color); }
    .auth-card { background:white; padding:2.5rem; border-radius:var(--radius-lg); box-shadow:var(--shadow-md); width:100%; max-width:420px; border:1px solid var(--border-light); }
    .auth-header { text-align:center; margin-bottom:2rem; }
    .auth-title { font-size:1.75rem; font-weight:700; margin-bottom:0.5rem; }
    .form-group { margin-bottom:1.25rem; }
    .form-label { display:block; font-size:0.875rem; font-weight:500; margin-bottom:0.5rem; }
    .form-control { width:100%; padding:0.75rem 1rem; border:1px solid var(--border-light); border-radius:var(--radius-md); font-size:1rem; }
    .btn-block { width:100%; padding:0.875rem; font-size:1rem; }
    .message { display:none; margin-bottom:1rem; text-align:center; font-size:0.875rem; }
    .auth-footer { text-align:center; margin-top:1.5rem; font-size:0.875rem; }
    .auth-link { color:var(--accent-burgundy); font-weight:500; }
</style>
{% endblock %}

{% block public_content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Reset your password</h1>
            <p style="color:var(--text-secondary);">Enter your registered email address to continue.</p>
        </div>
        <div id="reset-message" class="message"></div>
        <form id="email-form">
            <div class="form-group">
                <label class="form-label" for="reset-email">Email address</label>
                <input id="reset-email" class="form-control" type="email" required autocomplete="email">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Continue</button>
        </form>
        <form id="password-form" style="display:none;">
            <div class="form-group">
                <label class="form-label" for="new-password">New password</label>
                <input id="new-password" class="form-control" type="password" minlength="8" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm-password">Confirm new password</label>
                <input id="confirm-password" class="form-control" type="password" minlength="8" required autocomplete="new-password">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Set New Password</button>
        </form>
        <div class="auth-footer"><a href="/login" class="auth-link">Back to sign in</a></div>
    </div>
</div>
<script>
let resetToken = '';
const message = document.getElementById('reset-message');
function showMessage(text, color) {
    message.textContent = text;
    message.style.color = color;
    message.style.display = 'block';
}
document.getElementById('email-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    try {
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: document.getElementById('reset-email').value.trim()})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to verify email.');
        resetToken = data.reset_token;
        this.style.display = 'none';
        document.getElementById('password-form').style.display = 'block';
        showMessage(data.message, '#16a34a');
    } catch (error) {
        showMessage(error.message, '#dc2626');
    }
});
document.getElementById('password-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const password = document.getElementById('new-password').value;
    if (password !== document.getElementById('confirm-password').value) {
        showMessage('Passwords do not match.', '#dc2626');
        return;
    }
    try {
        const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: resetToken, password})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to reset password.');
        showMessage(data.message, '#16a34a');
        this.reset();
        setTimeout(() => { window.location.href = '/login'; }, 900);
    } catch (error) {
        showMessage(error.message, '#dc2626');
    }
});
</script>
{% endblock %}

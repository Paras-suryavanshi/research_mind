{% extends "base.html" %}

{% block title %}Settings | Research Mind{% endblock %}

{% block styles %}
<style>
    .settings-container { max-width: 800px; margin: 0 auto; background: white; border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 2rem; }
    .settings-section { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-light); }
    .settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
</style>
{% endblock %}

{% block content %}
<div class="settings-container">
    <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 2rem;">Account Settings</h1>
    
    <div class="settings-section">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Profile Information</h3>
        <div style="margin-bottom: 1rem;">
            <label class="form-label">Username</label>
            <input id="settings-username" type="text" class="form-control" value="{{ current_user.username }}" maxlength="20" required>
        </div>
        <div>
            <label class="form-label">Email Address</label>
            <input id="settings-email" type="email" class="form-control" value="{{ current_user.email }}" maxlength="120" required>
        </div>
    </div>
    
    <div class="settings-section">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Preferences</h3>
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
            <input type="checkbox" checked style="accent-color: var(--accent-burgundy);"> Enable automatic citation verification badge
        </label>
    </div>
    
    <div style="display: flex; justify-content: flex-end;">
        <button id="save-settings" class="btn btn-primary">Save Changes</button>
    </div>
    <p id="settings-message" style="display:none; margin-top:1rem; text-align:right;"></p>
    <div style="display:flex; justify-content:flex-start; margin-top:1.5rem;">
        <button id="logout-button" class="btn btn-outline">Logout</button>
    </div>
</div>
<script>
document.getElementById('save-settings').addEventListener('click', async function () {
    const message = document.getElementById('settings-message');
    const username = document.getElementById('settings-username').value.trim();
    const email = document.getElementById('settings-email').value.trim();
    this.disabled = true;
    message.style.display = 'none';
    try {
        const response = await fetch('/api/user/profile', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to save changes.');
        message.textContent = data.message;
        message.style.color = '#16a34a';
        message.style.display = 'block';
    } catch (error) {
        message.textContent = error.message;
        message.style.color = '#dc2626';
        message.style.display = 'block';
    } finally {
        this.disabled = false;
    }
});
document.getElementById('logout-button').addEventListener('click', async function () {
    this.disabled = true;
    try {
        const response = await fetch('/api/auth/logout', {method: 'POST'});
        if (!response.ok) throw new Error('Logout failed.');
        window.location.replace('/login');
    } catch (error) {
        this.disabled = false;
        message.textContent = error.message;
        message.style.color = '#dc2626';
        message.style.display = 'block';
    }
});
</script>
{% endblock %}
